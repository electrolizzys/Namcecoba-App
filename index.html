<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namtsetsoba</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --green: #2B8256;
            --green-dark: #1A5E3C;
            --bg: #0E1B14;
            --card: #14261C;
            --text: #F2F7F3;
            --muted: #9DB3A6;
            --border: #24402F;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: radial-gradient(1200px 600px at 50% -10%, #12301F 0%, var(--bg) 60%);
            color: var(--text);
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--green);
            margin-bottom: 24px;
        }
        .badge {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(43, 130, 86, 0.14);
            color: var(--green);
            font-size: 40px;
        }
        h1 { font-size: 1.55em; margin: 0 0 12px; }
        p { font-size: 1.02em; line-height: 1.5; color: var(--muted); margin: 8px 0 0; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0F2016;
            color: var(--text);
            font-size: 16px;
        }
        input:focus { outline: none; border-color: var(--green); }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: var(--green);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover { background: var(--green-dark); }
        .error { color: #FF7A7A; font-size: 14px; margin-top: 12px; }
        .success { color: #6BE39A; font-size: 14px; margin-top: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">🌱 Namtsetsoba</div>

        <!-- Email confirmation after registration -->
        <div id="confirm-page">
            <div class="badge">&#10003;</div>
            <h1>Registration confirmed</h1>
            <p>Your Namtsetsoba account email is verified. Close this page, open the app, and sign in with the email and password you registered.</p>
        </div>

        <!-- Password recovery -->
        <div id="reset-page" class="hidden">
            <div class="badge">&#128273;</div>
            <h1>Recover your password</h1>
            <p>Choose a new password for your Namtsetsoba account. After saving, return to the app and sign in.</p>
            <input type="password" id="new-password" placeholder="New password (min. 6 characters)">
            <input type="password" id="confirm-password" placeholder="Confirm new password">
            <div id="reset-message"></div>
            <button onclick="updatePassword()">Save new password</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cikpfliqixgkrydporpa.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ybR9eKUFIWhl1RlrCn3alQ_8To8zmR3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function init() {
            const hash = window.location.hash || '';
            const params = new URLSearchParams(hash.replace(/^#/, ''));
            const type = params.get('type') || '';
            if (type === 'recovery' || hash.includes('type=recovery')) {
                document.getElementById('confirm-page').classList.add('hidden');
                document.getElementById('reset-page').classList.remove('hidden');
            }
        }

        async function updatePassword() {
            const pw = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const msg = document.getElementById('reset-message');

            if (pw.length < 6) {
                msg.innerHTML = '<p class="error">Password must be at least 6 characters.</p>';
                return;
            }
            if (pw !== confirm) {
                msg.innerHTML = '<p class="error">Passwords do not match.</p>';
                return;
            }

            const { error } = await client.auth.updateUser({ password: pw });

            if (error) {
                msg.innerHTML = '<p class="error">Could not update your password. The recovery link may have expired — request a new one from the app.</p>';
            } else {
                document.getElementById('reset-page').innerHTML =
                    '<div class="badge">&#10003;</div>' +
                    '<h1>Password recovered</h1>' +
                    '<p>Your password was updated. Return to the Namtsetsoba app and sign in with your new password.</p>';
            }
        }

        init();
    </script>
</body>
</html>
